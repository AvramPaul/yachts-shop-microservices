<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yachts Shop — Order Receipt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy:       #060f1e;
            --navy-mid:   #0b1f38;
            --gold:       #c9a84c;
            --white:      #f5f0e8;
            --muted:      #7a8fa8;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--navy);
            color: var(--white);
            font-family: 'Lato', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .receipt-card {
            background: var(--navy-mid);
            border-top: 3px solid var(--gold);
            padding: 4rem;
            width: 100%;
            max-width: 600px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease forwards;
        }

        .icon {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3rem;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            text-align: left;
            margin-bottom: 3rem;
            border-top: 1px solid rgba(201, 168, 76, 0.2);
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
            padding: 2rem 0;
        }

        .data-group { display: flex; flex-direction: column; gap: 0.4rem; }

        .data-label {
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .data-value {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
        }

        .btn-home {
            display: inline-block;
            padding: 1rem 2.5rem;
            border: 1px solid var(--gold);
            color: var(--white);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: var(--gold);
            color: var(--navy);
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="receipt-card" id="receipt">
    <div class="icon">⚓</div>
    <h1 class="title">Order Confirmed</h1>
    <p class="subtitle">Official Receipt</p>

    <div class="data-grid" id="data-container">
        <p style="color: var(--muted); grid-column: span 2; text-align: center;">Fetching order details...</p>
    </div>

    <a href="https://ca-yacht-catalog.kinddesert-607bfa92.germanywestcentral.azurecontainerapps.io" class="btn-home">Return to Fleet</a>
</div>

<script>
    // 1. Get the ID from the URL (e.g., ?id=1)
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('id');

    // 2. Fetch the raw JSON from the backend endpoint we made earlier
    async function loadReceipt() {
        try {
            const res = await fetch('/orders/' + orderId);
            if (!res.ok) throw new Error('Order not found');
            const order = await res.json();

            // 3. Inject the JSON data into our styled HTML
            document.getElementById('data-container').innerHTML = `
                    <div class="data-group">
                        <span class="data-label">Order Reference</span>
                        <span class="data-value">#00${order.id}</span>
                    </div>
                    <div class="data-group">
                        <span class="data-label">Customer</span>
                        <span class="data-value">${order.customerName}</span>
                    </div>
                    <div class="data-group">
                        <span class="data-label">Vessel Name</span>
                        <span class="data-value">${order.yachtName}</span>
                    </div>
                    <div class="data-group">
                        <span class="data-label">Price Paid</span>
                        <span class="data-value" style="color: var(--gold)">$${new Intl.NumberFormat('en-US').format(order.pricePaid)}</span>
                    </div>
                `;
        } catch (err) {
            document.getElementById('data-container').innerHTML =
                `<p style="color: #c94c4c; grid-column: span 2; text-align: center;">Error loading order details.</p>`;
        }
    }

    if (orderId) loadReceipt();
</script>
</body>
</html>
